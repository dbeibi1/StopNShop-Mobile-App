<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img"><title>Application navigation diagram</title><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#202124" stroke-width="2"/></marker><marker id="triangle" viewBox="0 0 16 14" refX="15" refY="7" markerWidth="15" markerHeight="13" orient="auto"><path d="M1 1 L15 7 L1 13 Z" fill="white" stroke="#202124" stroke-width="1.5"/></marker><marker id="diamond" viewBox="0 0 16 14" refX="0" refY="7" markerWidth="15" markerHeight="13" orient="auto"><path d="M0 7 L8 1 L16 7 L8 13 Z" fill="#202124"/></marker></defs><rect x="0" y="0" width="1000" height="1080" rx="0" fill="white" stroke="none" stroke-width="2"/><text x="35" y="36" font-family="Arial, sans-serif" font-size="28" text-anchor="start" fill="#202124" font-weight="bold">Application navigation diagram</text><polyline points="170,142 170,220" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="170,302 170,445" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="78" y="347" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Browse /</text><text x="78" y="372" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">shortcut</text><polyline points="500,302 500,367 170,367 170,445" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="470" y="355" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Select category</text><polyline points="830,302 830,409 215,409 215,445" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="535" y="393" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Browse all</text><polyline points="265,486 405,486" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="275" y="470" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">View details</text><polyline points="265,260 330,260 330,435 500,435 500,445" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="357" y="349" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Featured</text><polyline points="595,486 640,486 640,260 735,260" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="650" y="244" font-family="Arial, sans-serif" font-size="17" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">View cart</text><polyline points="830,302 830,445" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="725" y="429" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Nonempty checkout</text><polyline points="925,486 975,486 975,260 925,260" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="956" y="370" transform="rotate(-90 956 370)" text-anchor="middle" font-family="Arial" font-size="18" fill="#59545A">Back or edit Cart</text><polyline points="830,527 830,695" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="720" y="638" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Place demo order</text><polyline points="735,736 685,736 685,825 42,825 42,260 75,260" fill="none" stroke="#202124" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="340" y="810" font-family="Arial, sans-serif" font-size="21" text-anchor="start" fill="#59545A" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Continue shopping or Back</text><rect x="75" y="70" width="190" height="72" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="170.0" y="100.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">One second</text><text x="170.0" y="128.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">branded splash</text><rect x="58" y="198" width="892" height="125" rx="15" fill="none" stroke="#59545A" stroke-width="2" stroke-dasharray="8 5"/><rect x="75" y="220" width="190" height="82" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="170.0" y="269.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">Home</text><rect x="405" y="220" width="190" height="82" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="500.0" y="269.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">Categories</text><rect x="735" y="220" width="190" height="82" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="830.0" y="269.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">Cart</text><rect x="75" y="445" width="190" height="82" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="170.0" y="480.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">Product list</text><text x="170.0" y="508.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">all or category</text><rect x="405" y="445" width="190" height="82" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="500.0" y="494.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">Product details</text><rect x="735" y="445" width="190" height="82" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="830.0" y="494.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">Checkout</text><rect x="735" y="695" width="190" height="82" rx="12" fill="#FFF6F7" stroke="#202124" stroke-width="2"/><text x="830.0" y="730.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">Order</text><text x="830.0" y="758.0" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#202124">confirmation</text><text x="60" y="905" font-family="Arial, sans-serif" font-size="20" text-anchor="start" fill="#59545A">Tabs select Home, Categories or Cart from Home, Categories, List, Details and Cart.</text><text x="60" y="942" font-family="Arial, sans-serif" font-size="20" text-anchor="start" fill="#59545A">Back from List returns to its origin: Home, Categories or Cart.</text><text x="60" y="978" font-family="Arial, sans-serif" font-size="20" text-anchor="start" fill="#59545A">Back from Details restores Home or List and its previous scroll position.</text><text x="60" y="1014" font-family="Arial, sans-serif" font-size="20" text-anchor="start" fill="#59545A">Checkout and Confirmation hide tabs. Back from Categories or Cart opens Home.</text><text x="60" y="1050" font-family="Arial, sans-serif" font-size="20" text-anchor="start" fill="#59545A">Recreation retains state in the same process; a new process starts a fresh session.</text></svg>